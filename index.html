    <script>
        const modal = document.getElementById('platform-modal');
        const modalContent = document.getElementById('modal-content');
        const modalTitle = document.getElementById('modal-track-title');

        // Función para abrir el modal
        function openModal(trackName) {
            // Actualizar el título del modal con el nombre de la canción
            modalTitle.textContent = "Escuchar: " + trackName.split('. ')[1]; // Toma solo el nombre, quitando el número

            // Mostrar el modal (quitar clases que lo ocultan)
            modal.classList.remove('opacity-0', 'invisible');
            
            // Animación de escala para el contenido
            setTimeout(() => {
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
            
            // Prevenir scroll en el body
            document.body.style.overflow = 'hidden';
        }

        // Función para cerrar el modal
        function closeModal() {
            // Animación de salida
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            // Ocultar modal después de la animación
            setTimeout(() => {
                modal.classList.add('opacity-0', 'invisible');
                // Restaurar scroll en el body
                document.body.style.overflow = '';
            }, 200); // 200ms coincide con algo más rápido que la duración de transición
        }

        // Cerrar modal al hacer clic fuera del contenido
        modal.addEventListener('click', function(event) {
            if (event.target === modal) {
                closeModal();
            }
        });
        
        // --- Lógica del Modal de Artistas ---
        const artistModal = document.getElementById('artist-modal');
        const artistModalContent = document.getElementById('artist-modal-content');
        const artistModalTitle = document.getElementById('artist-modal-title');

        // Función para abrir el modal de artista
        function openArtistModal(artistName) {
            artistModalTitle.textContent = artistName;
            artistModal.classList.remove('opacity-0', 'invisible');
            
            setTimeout(() => {
                artistModalContent.classList.remove('scale-95');
                artistModalContent.classList.add('scale-100');
            }, 10);
            
            document.body.style.overflow = 'hidden';
        }

        // Función para cerrar el modal de artista
        function closeArtistModal() {
            artistModalContent.classList.remove('scale-100');
            artistModalContent.classList.add('scale-95');
            
            setTimeout(() => {
                artistModal.classList.add('opacity-0', 'invisible');
                // Restaurar scroll solo si el otro modal también está cerrado
                if (modal.classList.contains('invisible')) {
                    document.body.style.overflow = '';
                }
            }, 200);
        }

        // Cerrar modal de artista al hacer clic fuera
        artistModal.addEventListener('click', function(event) {
            if (event.target === artistModal) {
                closeArtistModal();
            }
        });
        
        // Cerrar ambos modales con tecla ESC
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                if (!modal.classList.contains('invisible')) closeModal();
                if (!artistModal.classList.contains('invisible')) closeArtistModal();
            }
        });
    </script>
</body>
</html>
