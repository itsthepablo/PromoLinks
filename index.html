        .glass-panel {

        }

        .track-item {
            transition: all 0.2s ease;

        }

        }
        .platform-btn:hover {

        }

            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;

        }

    <script>
        // Modal de plataformas (tracklist)
        const modal = document.getElementById('platform-modal');
        const modalContent = document.getElementById('modal-content');
        const modalTitle = document.getElementById('modal-track-title');

        function openModal(trackName) {
            modalTitle.textContent = "Escuchar: " + trackName.split('. ')[1];
            modal.classList.remove('opacity-0', 'invisible');
            setTimeout(() => {
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('opacity-0', 'invisible');
                document.body.style.overflow = '';
            }, 200);
        }

        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        
        // Modal de artistas
        const artistModal = document.getElementById('artist-modal');
        const artistModalContent = document.getElementById('artist-modal-content');
        const artistModalTitle = document.getElementById('artist-modal-title');
        const artistModalImg = document.getElementById('artist-modal-img');
        const artistModalPlaceholder = document.getElementById('artist-modal-placeholder');
        const artistModalLinks = document.getElementById('artist-modal-links');

        const artistLinks = {
            "just cy": {
                yt: "https://www.youtube.com/@JustCyMusic",
                ig: "https://www.instagram.com/justcymusic/"
            },
            "jel kaizen": {
                yt: "https://www.youtube.com/@JelKaizen",
                ig: "https://www.instagram.com/jel_nk_2.0/",
                sc: "https://soundcloud.com/jel-kaizen"
            },
            "vinze tremaria": {
                yt: "https://www.youtube.com/@VinzeTremaria",
                ig: "https://www.instagram.com/vinzetremaria/",
                sc: "https://soundcloud.com/yandri-tremaria"
            },
            "joivsami": {
                yt: "https://www.youtube.com/@Joivsami_Music",
                ig: "https://www.instagram.com/joivsami/",
                sc: "https://soundcloud.com/joivsami"
            },
            "prodix": {
                yt: "https://www.youtube.com/@goodbv1528bv",
                sc: "https://soundcloud.com/good1528-bv"
            },
            "almatrusko": {
                yt: "https://www.youtube.com/@almatrusko89",
                sc: "https://soundcloud.com/lion-887410719"
            },
            "kvkr": {
                yt: "https://www.youtube.com/@KVKR_KVKR_KVKR",
                ig: "https://www.instagram.com/mastica_ojos9000",
                sc: "https://soundcloud.com/kvkr"
            }
        };

        const artistasConFoto = [
            'just cy', 'jel kaizen', 'vinze tremaria', 'joivsami',
            'prodix', 'almatrusko', 'kvkr'
        ];

        function openArtistModal(artistName) {
            // Cambio: "Sigue a " en lugar de "Siga a "
            artistModalTitle.textContent = "Sigue a " + artistName + " en";
            
            const nombreArchivo = artistName.toLowerCase().replace(/\s+/g, '') + '.jpg';
            const tieneFoto = artistasConFoto.includes(artistName.toLowerCase());
            artistModalImg.classList.add('hidden');
            artistModalPlaceholder.classList.add('hidden');
            if (tieneFoto) {
                artistModalImg.src = nombreArchivo;
                artistModalImg.classList.remove('hidden');
            } else {
                artistModalPlaceholder.classList.remove('hidden');
            }
            
            const links = artistLinks[artistName.toLowerCase()];
            artistModalLinks.innerHTML = '';
            if (links) {
                const plataformas = [
                    { key: 'yt', icon: 'fa-youtube', color: '#FF0000', label: 'YouTube' },
                    { key: 'ig', icon: 'fa-instagram', color: '#E1306C', label: 'Instagram' },
                    { key: 'sc', icon: 'fa-soundcloud', color: '#ff5500', label: 'SoundCloud' }
                ];
                
                plataformas.forEach(p => {
                    if (links[p.key]) {
                        const a = document.createElement('a');
                        a.href = links[p.key];
                        a.target = '_blank';
                        a.rel = 'noopener';
                        a.className = 'platform-btn flex flex-col items-center justify-center p-3 rounded-xl border border-slate-700 bg-slate-800/50 hover:border-' + (p.key === 'yt' ? '[#FF0000]' : (p.key === 'ig' ? '[#E1306C]' : '[#ff5500]')) + ' group text-decoration-none w-24';
                        a.style.transition = 'all 0.2s';
                        a.innerHTML = `
                            <i class="fab ${p.icon} text-2xl mb-1" style="color: ${p.color}"></i>
                            <span class="text-xs font-medium text-slate-300 group-hover:text-white">${p.label}</span>
                        `;
                        artistModalLinks.appendChild(a);
                    }
                });
                
                if (artistModalLinks.children.length === 0) {
                    artistModalLinks.innerHTML = '<p class="text-slate-400 text-sm">Próximamente más enlaces</p>';
                }
            } else {
                artistModalLinks.innerHTML = '<p class="text-slate-400 text-sm">No hay enlaces disponibles</p>';
            }
            
            artistModal.classList.remove('opacity-0', 'invisible');
            setTimeout(() => {
                artistModalContent.classList.remove('scale-95');
                artistModalContent.classList.add('scale-100');
            }, 10);
            document.body.style.overflow = 'hidden';
        }

        function closeArtistModal() {
            artistModalContent.classList.remove('scale-100');
            artistModalContent.classList.add('scale-95');
            setTimeout(() => {
                artistModal.classList.add('opacity-0', 'invisible');
                if (modal.classList.contains('invisible')) {
                    document.body.style.overflow = '';
                }
            }, 200);
        }

        artistModal.addEventListener('click', (e) => { if (e.target === artistModal) closeArtistModal(); });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape") {
                if (!modal.classList.contains('invisible')) closeModal();
                if (!artistModal.classList.contains('invisible')) closeArtistModal();
            }
        });
    </script>
</body>
</html>
